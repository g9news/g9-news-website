<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>G9 News</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #17202a;
      background: #fff;
    }

    header {
      background: #123b72;
      padding: 15px;
      text-align: center;
    }

    header img {
      height: 60px;
      background: white;
    }

    .container {
      max-width: 900px;
      width: 92%;
      margin: 30px auto;
    }

    .category {
      display: inline-block;
      background: #c40000;
      color: white;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
    }

    h1 {
      font-size: 34px;
      line-height: 1.25;
    }

    .summary {
      font-size: 18px;
      color: #667085;
      line-height: 1.6;
    }

    .article-image {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      margin: 20px 0;
    }

    .article-body {
      font-size: 18px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #c40000;
      font-weight: bold;
      text-decoration: none;
    }

    @media(max-width:600px) {
      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="/">
    <img src="logo.png" alt="G9 News">
  </a>
</header>

<main class="container" id="article">
  <p>Loading article...</p>
</main>

<script>
async function loadArticle() {
  const container = document.getElementById("article");
  const id = new URLSearchParams(window.location.search).get("id");

  if (!id) {
    container.innerHTML = "<p>Article not found.</p>";
    return;
  }

  try {
    const response = await fetch("/api/supabase");
    const data = await response.json();

    const articles = data.articles || [];
    const article = articles.find(item => item.id === id);

    if (!article) {
      container.innerHTML = "<p>Article not found.</p>";
      return;
    }

    document.title = `${article.title || "G9 News"} | G9 News`;

    container.innerHTML = `
      <span class="category">${article.category || "Latest"}</span>

      <h1>${article.title || ""}</h1>

      <div class="summary">${article.summary || ""}</div>

      ${article.thumbnail_url ? `
        <img
          class="article-image"
          src="${article.thumbnail_url}"
          alt="${article.title || ""}">
      ` : ""}

      <div class="article-body">${article.body || ""}</div>

      <a class="back" href="/">← Back to G9 News</a>
    `;

  } catch (error) {
    console.error(error);
    container.innerHTML = "<p>Could not load article.</p>";
  }
}

loadArticle();
</script>

</body>
</html>
