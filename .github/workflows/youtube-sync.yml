name: Sync YouTube Videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync G9 News YouTube videos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl --fail --silent --show-error -H "Authorization: Bearer $CRON_SECRET" "https://g9newstelugu.com/api/sync-youtube"
