<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Article - G9 News</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      background: #c90000;
      color: white;
      padding: 18px 25px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
    }

    #body {
      min-height: 300px;
    }

    #photoPreview {
      max-width: 300px;
      margin-top: 12px;
      display: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h2>G9 NEWS — Add New Article</h2>
</header>

<div class="container">

  <label>Headline</label>
  <input id="title" type="text">

  <label>Summary</label>
  <textarea id="summary"></textarea>

  <label>Full Article</label>
  <textarea id="body"></textarea>

  <label>Article Photo</label>
  <input id="photo" type="file" accept="image/*">
  <img id="photoPreview">

  <label>Category</label>
  <select id="category">
    <option>Latest</option>
    <option>Telangana</option>
    <option>Andhra Pradesh</option>
    <option>India</option>
    <option>Politics</option>
    <option>Crime</option>
    <option>Business</option>
    <option>Sports</option>
    <option>Entertainment</option>
  </select>

  <button onclick="window.location.href='/dashboard.html'">Back</button>
  <button onclick="saveArticle('draft')">Save Draft</button>
<button onclick="saveArticle('published')">Publish</button>

  <div id="message"></div>

</div>

<script>
const token = sessionStorage.getItem("g9_admin_token");

if (!token) {
  window.location.href = "/admin.html";
}

document.getElementById("photo").addEventListener("change", function () {
  const file = this.files[0];
  const preview = document.getElementById("photoPreview");

  if (!file) {
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
});
async function saveArticle(status) {
  const message = document.getElementById("message");
  const title = document.getElementById("title").value.trim();

  if (!title) {
    message.innerText = "Please enter a headline.";
    return;
  }

  message.innerText = "Saving...";

  try {
    let thumbnailUrl = null;
    const photoFile = document.getElementById("photo").files[0];

    if (photoFile) {
      message.innerText = "Uploading photo...";

      const uploadResponse = await fetch("/api/admin-upload-image", {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": photoFile.type,
          "X-File-Name": encodeURIComponent(photoFile.name)
        },
        body: photoFile
      });

      const uploadData = await uploadResponse.json();

      if (!uploadData.success) {
        message.innerText = uploadData.error || "Photo upload failed.";
        return;
      }

      thumbnailUrl = uploadData.url;
    }

    const response = await fetch("/api/admin-save-article", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify({
        title: title,
        summary: document.getElementById("summary").value,
        body: document.getElementById("body").value,
        category: document.getElementById("category").value,
        thumbnail_url: thumbnailUrl,
        status: status
      })
    });

    const data = await response.json();

    if (data.success) {
      message.innerText =
        status === "published"
          ? "Article published successfully ✅"
          : "Draft saved successfully ✅";

      setTimeout(() => {
        window.location.href = "/dashboard.html";
      }, 800);
    } else {
      message.innerText = data.error || "Could not save article.";
    }

  } catch (error) {
    message.innerText = "Could not save article.";
  }
}
</script>

</body>
</html>
